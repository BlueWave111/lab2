<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            min-height:800 px;

            display: flex;

        }
        #Header{

        #Main{

        }
        .box{
            align-items: center;

            height: 100px;
            border: 8px solid green;
            background-color: white;
        }
    </style>
</head>
<body>
    <div id="Header" class="box">
        Header
    </div>
    <div id="Main" style="display: flex; flex: 1;">
